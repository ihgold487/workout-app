    <meta name="apple-mobile-web-app-title" content="Workout" />

    <link rel="apple-touch-icon" sizes="180x180" href="/workout-app/workout-icon.png?v=2" />

    <link rel="icon" href="/workout-app/workout-icon.png?v=2" />

    <title>Workout</title>

    <style>
      html {
        background: #f7f4fb;
        color-scheme: light;
        min-height: 100%;
      }

      body {
        background: #f7f4fb;
        margin: 0;
        min-height: 100%;
      }

      #root {
        min-height: 100vh;
      }

      #app-startup-splash {
        align-items: center;
        background:
          radial-gradient(circle at 50% 42%, rgba(170, 59, 255, 0.1), transparent 32%),
          #f7f4fb;
        bottom: 0;
        display: flex;
        flex-direction: column;
        gap: 16px;
        justify-content: center;
        left: 0;
        opacity: 1;
        position: fixed;
        right: 0;
        top: 0;
        transition:
          opacity 180ms ease,
          visibility 180ms ease;
        visibility: visible;
        z-index: 99999;
      }

      #app-startup-splash .startup-mark {
        align-items: center;
        background: linear-gradient(145deg, #fff, #efe4fb);
        border: 1px solid rgba(170, 59, 255, 0.18);
        border-radius: 24px;
        box-shadow: 0 18px 45px rgba(48, 17, 80, 0.14);
        color: #7a1fc2;
        display: inline-flex;
        height: 96px;
        justify-content: center;
        position: relative;
        width: 96px;
      }

      #app-startup-splash .startup-mark img {
        border-radius: 22px;
        display: block;
        height: 96px;
        inset: 0;
        object-fit: cover;
        position: absolute;
        width: 96px;
        z-index: 1;
      }

      #app-startup-splash .startup-mark::before,
      #app-startup-splash .startup-mark::after {
        background: currentColor;
        border-radius: 999px;
        content: "";
        display: block;
        height: 14px;
        position: absolute;
        width: 64px;
      }

      #app-startup-splash .startup-mark::before {
        transform: translateY(-13px);
      }

      #app-startup-splash .startup-mark::after {
        transform: translateY(13px);
      }

      #app-startup-splash .startup-title {
        color: #08060d;
        font: 700 22px/1.1 system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }

      #app-startup-splash .startup-loader {
        background: rgba(170, 59, 255, 0.14);
        border-radius: 999px;
        height: 5px;
        overflow: hidden;
        width: 128px;
      }

      #app-startup-splash .startup-loader::before {
        animation: startup-loader 1.05s ease-in-out infinite;
        background: #aa3bff;
        border-radius: inherit;
        content: "";
        display: block;
        height: 100%;
        width: 46px;
      }

      html.app-ready #app-startup-splash {
        opacity: 0;
        pointer-events: none;
        visibility: hidden;
      }

      @keyframes startup-loader {
        0% {
          transform: translateX(-48px);
        }

        100% {
          transform: translateX(130px);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #app-startup-splash,
        #app-startup-splash .startup-loader::before {
          animation: none;
          transition: none;
        }
      }
    </style>

    <link rel="modulepreload" crossorigin href="/workout-app/assets/rolldown-runtime-BM3Ffeng.js">
    <link rel="stylesheet" crossorigin href="/workout-app/assets/index-BKapIT1U.css">
  <link rel="manifest" href="/workout-app/manifest.webmanifest"></head>

  <body>
    <div
      id="app-startup-splash"
      role="status"
      aria-label="Loading Workout"
    >
      <div class="startup-mark" aria-hidden="true">
        <img src="workout-icon.png?v=2" alt="" />
      </div>
      <div class="startup-title">Workout</div>
      <div class="startup-loader" aria-hidden="true"></div>
    </div>
    <div id="root"></div>

  </body>
</html>

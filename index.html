<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />

    <meta name="color-scheme" content="light" />

    <meta name="apple-mobile-web-app-capable" content="yes" />

    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <meta name="apple-mobile-web-app-title" content="Workout" />

    <link rel="apple-touch-icon" sizes="180x180" href="/workout-app/workout-icon.png?v=2" />

    <link rel="icon" href="/workout-app/workout-icon.png?v=2" />

    <title>Workout</title>

    <style>
      html {
        background: #fff;
        color-scheme: light;
      }

      body {
        background: #fff;
      }

      #app-startup-splash {
        align-items: center;
        background: #fff;
        bottom: 0;
        display: flex;
        flex-direction: column;
        gap: 18px;
        justify-content: center;
        left: 0;
        opacity: 1;
        position: fixed;
        right: 0;
        top: 0;
        transition:
          opacity 180ms ease,
          visibility 180ms ease;
        visibility: visible;
        z-index: 99999;
      }

      #app-startup-splash img {
        border-radius: 28px;
        box-shadow: 0 18px 45px rgba(0, 0, 0, 0.14);
        height: 132px;
        width: 132px;
      }

      #app-startup-splash .startup-title {
        color: #08060d;
        font: 700 22px/1.1 system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }

      #app-startup-splash .startup-loader {
        background: #efe9f7;
        border-radius: 999px;
        height: 5px;
        overflow: hidden;
        width: 128px;
      }

      #app-startup-splash .startup-loader::before {
        animation: startup-loader 1.05s ease-in-out infinite;
        background: #aa3bff;
        border-radius: inherit;
        content: "";
        display: block;
        height: 100%;
        width: 46px;
      }

      html.app-ready #app-startup-splash {
        opacity: 0;
        pointer-events: none;
        visibility: hidden;
      }

      @keyframes startup-loader {
        0% {
          transform: translateX(-48px);
        }

        100% {
          transform: translateX(130px);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #app-startup-splash,
        #app-startup-splash .startup-loader::before {
          animation: none;
          transition: none;
        }
      }
    </style>
    <script type="module" crossorigin src="/workout-app/assets/index-C0GWW7B5.js"></script>
    <link rel="modulepreload" crossorigin href="/workout-app/assets/rolldown-runtime-BM3Ffeng.js">
    <link rel="stylesheet" crossorigin href="/workout-app/assets/index-KrSeY7aZ.css">
  <link rel="manifest" href="/workout-app/manifest.webmanifest"></head>

  <body>
    <div id="root"></div>
    <div
      id="app-startup-splash"
      role="status"
      aria-label="Loading Workout"
    >
      <img src="/workout-app/workout-icon.png?v=2" alt="" />
      <div class="startup-title">Workout</div>
      <div class="startup-loader" aria-hidden="true"></div>
    </div>

  </body>
</html>
